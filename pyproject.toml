[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-fond-de-plan"
version = "1.11.0"
description = "Deterministic urban morphology and metric R2018 CAD engine for architectural site plans"
readme = "DEVELOPMENT_ARCHITECTURE_MAP.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "ezdxf==1.4.5",
  "shapely==2.2.0",
  "geopandas==1.2.0",
  "scipy==1.18.1",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "networkx==3.7",
  "osmnx==2.1.1",
  "svgwrite==1.4.3",
  "pyproj==3.8.0",
  "CairoSVG==2.9.1",
  "Pillow==13.0.0",
  "requests==2.34.2",
  "mcp==1.30.0",
  "pydantic==2.12.5",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "build==1.3.0"]

[project.scripts]
cad-fond-de-plan-mcp = "server.mcp_server:main"

[tool.setuptools]
packages = ["server", "tools"]
include-package-data = true

[tool.setuptools.package-data]
tools = ["*.py", "*.sh"]
server = ["*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
