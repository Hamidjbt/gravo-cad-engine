name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite must never reach the network: every HTTP surface is mocked.
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Deterministic iteration order, independent of the runner's hash seed.
  PYTHONHASHSEED: "0"
  # Scratch space. /tmp is ordinary disk on a runner; the sandbox keeps /var/tmp
  # (see the Makefile) because there /tmp is a bounded tmpfs.
  TMP_ROOT: /tmp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Show toolchain
        run: python --version && git --version

      # The monitored tree does not exist on a runner. Point footprint accounting
      # at throwaway space. This must stay at step level: the `runner` context is
      # not available in a workflow-level `env:` block, and referencing it there
      # makes the whole workflow invalid ("Unrecognized named-value: 'runner'").
      - name: Prepare the monitored workspace
        env:
          GRAVO_WORKSPACE: ${{ runner.temp }}/gravo-workspace
        run: mkdir -p "$GRAVO_WORKSPACE"

      # Tests run before lint, matching the required local order.
      - name: make test
        env:
          GRAVO_WORKSPACE: ${{ runner.temp }}/gravo-workspace
        run: make test

      - name: make lint
        run: make lint
