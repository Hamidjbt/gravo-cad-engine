name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: python --version && git --version

      # Tests run before lint, matching the required local order.
      - name: make test
        run: make test

      - name: make lint
        run: make lint
